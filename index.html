  color-scheme:light; }
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-ui);overflow:hidden}
#map{position:absolute;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.28)}

/* arama */
#search{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:min(360px,calc(100vw - 92px));z-index:5}
#search .box{display:flex;align-items:center;gap:8px;padding:0 12px;height:48px}
#search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 16px var(--f-ui);outline:none}
#search input::placeholder{color:var(--muted)}
#results{margin-top:6px;overflow:hidden}
#results button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;border-top:1px solid var(--line)}
#results button:first-child{border-top:0}
#results button:hover,#results button:focus-visible{background:var(--line)}
#results small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* manevra tabelası */
#maneuver{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 24px));z-index:6;background:var(--man-bg);color:var(--man-ink);border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.35);overflow:hidden}
#maneuver .row{display:flex;gap:14px;align-items:center;padding:12px 16px}
#mIcon{flex:none;width:64px;height:64px}
#mDist{font:700 34px/1 var(--f-sign);letter-spacing:.01em;font-variant-numeric:tabular-nums}
#mText{font:600 17px/1.2 var(--f-sign);margin-top:2px}
#mStreet{font:500 15px/1.2 var(--f-ui);color:var(--man-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mLanes{display:flex;justify-content:center;gap:2px;padding:6px 10px 8px;background:rgba(0,0,0,.22)}
#mLanes svg{width:30px;height:36px}
#mLanes .sep{width:2px;background:rgba(255,255,255,.35);margin:4px 0;border-radius:1px}

/* kavşak görünümü */
#jv{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(360px,calc(100vw - 24px));z-index:5;overflow:hidden}
#jv header{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:10px 14px 8px}
#jv h2{margin:0;font:700 13px var(--f-sign);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#jv .meta{font:500 13px var(--f-ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#jvClose{border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0 4px}
#jvArt{position:relative}
#jvArt svg{display:block;width:100%;height:auto}
#jvDist{position:absolute;left:10px;bottom:8px;font:700 22px/1 var(--f-sign);color:#fff;background:rgba(0,0,0,.45);padding:4px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
#jvDist:empty{display:none}
.sg1{font:700 16px var(--f-sign);fill:#fff}
.sg2{font:600 12px var(--f-sign);fill:#fff;letter-spacing:.04em}

/* sağ kontrol rayı */
#rail{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(120px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:4}
#rail button{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:700 15px var(--f-sign);letter-spacing:.04em}
#rail svg{width:24px;height:24px}
#rail button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
body.pick #map canvas{cursor:crosshair}

/* durum çipi */
#status{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font:500 13px var(--f-ui);color:var(--muted);max-width:calc(100vw - 110px)}
#status i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
#status.ok i{background:var(--go)} #status.busy i{background:var(--warn);animation:pulse 1s infinite} #status.err i{background:var(--stop)}
#status span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.3}}

/* yolculuk şeridi */
#trip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100vw - 24px));z-index:6;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 14px}
.sl{flex:none;width:52px;height:52px;border-radius:50%;background:#fff;border:6px solid #d42a2a;display:grid;place-items:center;font:700 20px var(--f-sign);color:#111;box-sizing:border-box}
.sl.none{border-color:#8a96a6;color:#8a96a6}
.spd{flex:none;text-align:center;min-width:52px}
.spd b{display:block;font:700 30px/1 var(--f-sign);font-variant-numeric:tabular-nums}
.spd small{color:var(--muted);font-size:12px}
.eta{flex:1;min-width:0}
.eta b{font:700 22px/1.1 var(--f-sign);color:var(--go);font-variant-numeric:tabular-nums}
.eta div{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tbtn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;height:42px;padding:0 12px;font:600 15px var(--f-sign);letter-spacing:.03em}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tbtn.icon{width:42px;padding:0}
.trip-btns{display:flex;gap:6px;flex:none}
.tbtn.icon svg{width:20px;height:20px;display:block;margin:auto}
.tbtn.off{opacity:.55}
.sl.over{animation:over .8s infinite}
.spd.over b{color:var(--stop)}
@keyframes over{50%{box-shadow:0 0 0 6px rgba(255,77,79,.45)}}

/* yaklaşan uyarılar */
#alerts{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(72px + env(safe-area-inset-top,0px));z-index:6;display:flex;flex-direction:column;gap:8px;width:184px}
.alert{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px}
.alert img{flex:none;width:44px;height:44px;object-fit:contain}
.alert b{display:block;font:700 24px/1 var(--f-sign);font-variant-numeric:tabular-nums}
.alert span{display:block;color:var(--muted);font:600 13px/1.2 var(--f-sign);margin-top:2px}
.alert.hot{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn) inset,0 10px 30px rgba(0,0,0,.28)}

/* mevcut yol ve şerit sayısı */
#road{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;max-width:calc(100vw - 40px);box-sizing:border-box}
#rName{font:600 15px var(--f-sign);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#rLanes{flex:none;display:flex;align-items:center;gap:6px;color:var(--muted);font:600 13px var(--f-sign);white-space:nowrap}
#rLanes i{display:flex;gap:2px}
#rLanes i u{display:block;width:5px;height:14px;border-radius:1.5px;background:var(--accent)}

/* ipucu */
#toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:8;padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100vw - 40px);text-align:center;transition:opacity .3s}
#toast.hide{opacity:0;pointer-events:none}

/* harita açılır menü */
.maplibregl-popup-content{background:var(--panel2);color:var(--ink);border-radius:12px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.maplibregl-popup-tip{border-top-color:var(--panel2)!important;border-bottom-color:var(--panel2)!important}
.pmenu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 12px;border-radius:8px;font:600 15px var(--f-sign)}
.pmenu button:hover{background:var(--line)}
.dest-pin{width:22px;height:22px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--stop);border:3px solid #fff;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.maplibregl-ctrl-attrib{background:var(--panel)!important;color:var(--muted)}
.maplibregl-ctrl-attrib a{color:var(--muted)}
.maplibregl-ctrl-bottom-right{bottom:env(safe-area-inset-bottom,0px)}


/* yükleme */
#load{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgba(6,10,16,.5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#load .card{width:min(420px,100%);padding:20px 22px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
#load small{color:var(--muted);font:600 11px var(--f-sign);letter-spacing:.1em;text-transform:uppercase}
#load h2{margin:0;font:700 24px/1.1 var(--f-sign)}
#load p{margin:0;color:var(--muted);font-size:14px}
#load .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
#load .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
#load.err .bar i{background:var(--warn)}
#loadTxt{font:500 14px var(--f-ui);font-variant-numeric:tabular-nums}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px;width:100%}
.sgrid button{height:48px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:3px;display:grid;place-items:center}
.sgrid button.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset;background:var(--line)}
.sgrid img{max-width:38px;max-height:38px}
#edhint.wide{width:min(560px,calc(100vw - 24px))}
#edhint.wide .sgrid{order:3}
.mnote{display:block;padding:2px 12px 6px;color:var(--muted);font-size:12px}
.hint .warn,b.warn{color:var(--warn)}
/* düzenleyici */
#rail button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
body.edit #trip,body.edit #maneuver,body.edit #jv{display:none!important}
body.edit #status{bottom:calc(100px + env(safe-area-inset-bottom,0px))}
#edbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:7;width:min(900px,calc(100vw - 24px));padding:5px 5px 4px;display:flex;flex-direction:column;gap:2px;box-sizing:border-box}
#edbar .tools{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
#edbar .tools::-webkit-scrollbar{display:none}
#edbar .tools button{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:56px;padding:7px 6px 5px;border:0;border-radius:10px;background:transparent;font:600 12px/1 var(--f-sign);letter-spacing:.02em}
#edbar .tools button svg{width:22px;height:22px}
#edbar .tools button:hover:not(:disabled){background:var(--line)}
#edbar .tools button.on{background:var(--accent);color:var(--accent-ink)}
#edbar .tools button:disabled{opacity:.32;cursor:default}
#edbar .tools .done{background:var(--go);color:#04210f;margin-left:auto}
#edbar .tools .sep{flex:none;width:1px;background:var(--line);margin:8px 3px}
body.orig #edbar [data-tool]{opacity:.3;pointer-events:none}
#edInfoRow{display:flex;justify-content:space-between;gap:10px;padding:0 8px 2px;font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap;overflow:hidden}
#edInfoRow .bad{color:var(--stop);font-weight:600}
#edhint{position:absolute;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:7;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:7px 7px 7px 14px;max-width:calc(100vw - 24px);box-sizing:border-box;font:500 14px var(--f-ui)}
#edhint span{flex:1 1 180px;min-width:0}
#edpanel{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:calc(12px + env(safe-area-inset-top,0px));width:min(340px,calc(100vw - 24px));max-height:calc(100% - 140px);overflow:auto;z-index:7;padding:12px 14px 14px;display:flex;flex-direction:column;gap:11px;box-sizing:border-box}
body.edit #rail{right:calc(max(12px,env(safe-area-inset-right,0px)) + 0px)}
@media (min-width:761px){ body.edit:has(#edpanel:not([hidden])) #rail{right:calc(max(12px,env(safe-area-inset-right,0px)) + 352px)} }
.edh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.edh small{color:var(--muted);font:600 11px var(--f-sign);letter-spacing:.08em;text-transform:uppercase}
.edh h3{margin:2px 0 0;font:700 21px/1.15 var(--f-sign);text-wrap:balance}
.edh button{border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;padding:0 2px}
.f{display:flex;align-items:center;justify-content:space-between;gap:10px}
.f>span{color:var(--muted);font-size:13px;flex:none}
.f input,.f select{flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--ink);padding:0 10px;font:500 15px var(--f-ui);box-sizing:border-box}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2)}
.step button{width:40px;height:36px;border:0;background:transparent;font:700 20px var(--f-sign)}
.step button:hover{background:var(--line)}
.step b{min-width:64px;text-align:center;font:700 17px var(--f-sign);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.seg button,.chips button{border:1px solid var(--line);background:var(--panel2);border-radius:8px;height:32px;padding:0 10px;font:600 14px var(--f-sign)}
.seg button.on,.chips button.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg button:disabled{opacity:.4}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:-4px}
.blk{display:flex;flex-direction:column;gap:6px}
.blk>span{color:var(--muted);font-size:12.5px}
.lanes{display:flex;gap:3px;background:#2b3542;padding:6px;border-radius:8px;justify-content:center;flex-wrap:wrap}
.lanes button{width:40px;height:54px;border:0;border-radius:6px;background:rgba(255,255,255,.07);padding:4px}
.lanes button:hover{background:rgba(255,255,255,.16)}
.lanes button svg{width:100%;height:100%}
.hint{margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.hint.warn{color:var(--warn)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;height:36px;padding:0 12px;font:600 14px var(--f-sign)}
.btn:hover:not(:disabled){background:var(--line)}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger,#edmenu .danger{color:var(--stop)}
#edmenu{position:absolute;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:8;display:flex;flex-direction:column;padding:6px;min-width:250px}
#edmenu button,#edmenu label{display:block;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:8px;font:600 15px var(--f-sign);cursor:pointer}
#edmenu button:hover,#edmenu label:hover{background:var(--line)}
#edmenu input{display:none}
body.edit .maplibregl-canvas{cursor:pointer}
@media (max-width:760px){
  #edpanel{top:auto;bottom:calc(96px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto;max-height:48%}
  #edhint{top:calc(12px + env(safe-area-inset-top,0px));left:12px;transform:none;max-width:calc(100vw - 84px)}
  body.edit #search{display:none}
  body.edit #rail{top:calc(12px + env(safe-area-inset-top,0px));bottom:auto}
  body.edit #status{display:none}
}
@media (max-width:760px){
  #jv{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:12px;right:12px;width:auto}
  body.nav #search{display:none}
  #search{width:calc(100vw - 92px)}
  #maneuver{top:calc(70px + env(safe-area-inset-top,0px))}
  body.nav #maneuver{top:calc(12px + env(safe-area-inset-top,0px))}
  #rail{top:calc(70px + env(safe-area-inset-top,0px));bottom:auto}
  body.nav #rail{top:auto;bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  body.nav.jvon #rail{display:none}
  #trip{gap:10px}
  .spd{display:none}
  #alerts{width:150px}
  .alert img{width:36px;height:36px}
  .alert b{font-size:20px}
  body.jvon #road{display:none}
}
@media (prefers-reduced-motion:reduce){ #status.busy i{animation:none} }
</style>

<body>
<div id="map"></div>

<div id="search">
  <div class="box panel">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Nereye gidiyoruz?" autocomplete="off" aria-label="Hedef ara">
  </div>
  <div id="results" class="panel" hidden></div>
</div>

<section id="maneuver" hidden aria-live="polite">
  <div class="row">
    <svg id="mIcon" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <div style="min-width:0">
      <div id="mDist">—</div>
      <div id="mText"></div>
      <div id="mStreet"></div>
    </div>
  </div>
  <div id="mLanes" hidden></div>
</section>

<aside id="jv" class="panel" hidden>
  <header><div style="min-width:0"><h2 id="jvTitle">Kavşak görünümü</h2><div class="meta" id="jvMeta"></div></div><button id="jvClose" aria-label="Kapat">×</button></header>
  <div id="jvArt"></div>
</aside>

<div id="rail">
  <button id="bRoute" class="panel" title="Yol tarifi: haritada hedefe dokun"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c3-6 11-2 14-12"/><circle cx="5" cy="19" r="2"/><path d="M19 3v4h-4"/></svg></button>
  <button id="bEdit" class="panel" title="Haritayı düzenle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button>
  <button id="b3d" class="panel" title="3B / 2B görünüm">3B</button>
  <button id="bNorth" class="panel" title="Kuzeye çevir"><svg id="compass" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 16 12H8z" fill="#ff4d4f"/><path d="M12 22 8 12h8z" fill="currentColor" opacity=".55"/></svg></button>
  <button id="bTheme" class="panel" title="Gece / gündüz"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
  <button id="bCar" class="panel" title="Araca dön"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 20 12 16 5 20z" fill="var(--accent)" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
</div>

<div id="status" class="panel"><i></i><span>Harita yükleniyor…</span></div>

<div id="alerts" aria-live="polite"></div>

    <button class="tbtn icon" id="bVoice" title="Sesli yönlendirme" aria-label="Sesli yönlendirme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    <button class="tbtn" id="bMult" title="Simülasyon hızı">1×</button>
    <button class="tbtn primary" id="bGo">Başlat</button>
    <button class="tbtn icon" id="bEnd" title="Rotayı kapat" aria-label="Rotayı kapat">✕</button>
  </div>

  if(t.traffic_calming&&!['no','island','chicane','choker'].includes(t.traffic_calming)) return 'bump';
  if(t.hazard) return HAZARD[t.hazard]||'warn';
  const ts=t.traffic_sign||'';
  if(/hazard|danger|TR:T-?\d|warning/i.test(ts)) return /children|school/i.test(ts)?'school':'warn';
  return null;

const alertSign=k=>(ALERT_KIND[k]||ALERT_KIND.warn)[1];

function processWay(w){
  if(ways.has(w.id)||!w.geometry||!w.tags) return;
  const t=w.tags, hw=t.highway, base=hw.replace('_link','');
  let coords=w.geometry.map(g=>[g.lon,g.lat]), nodes=(w.nodes||[]).slice();
  let oneway=['yes','1','true'].includes(t.oneway)||['roundabout','circular'].includes(t.junction)||base==='motorway';
  if(t.oneway==='-1'){ oneway=true; coords.reverse(); nodes.reverse(); }
  if(t.oneway==='no') oneway=false;
  const isLink=hw.endsWith('_link'), tagged=!!t.lanes;
  let L=parseInt(t.lanes)||0, fwd, bwd;
  if(oneway){ const tl=t['turn:lanes']; L=L||(tl?tl.split('|').length:0)||(isLink?1:2); fwd=L; bwd=0; }
  else{
    fwd=parseInt(t['lanes:forward'])||0; bwd=parseInt(t['lanes:backward'])||0;
    if(!fwd&&t['turn:lanes:forward']) fwd=t['turn:lanes:forward'].split('|').length;
    if(!bwd&&t['turn:lanes:backward']) bwd=t['turn:lanes:backward'].split('|').length;
    if(!L) L=(fwd&&bwd)?fwd+bwd:2;
    if(!fwd&&!bwd){ fwd=Math.ceil(L/2); bwd=Math.max(1,L-fwd); }
    else if(!fwd) fwd=Math.max(1,L-bwd); else if(!bwd) bwd=Math.max(1,L-fwd);
    L=fwd+bwd;
  }
  const W=ROADW[base]||3.0, lo=oneway?-L*W/2:-bwd*W, hi=oneway?L*W/2:fwd*W;
  const pr=proj(coords), P=pr.pts, C=cum(P);
  if(C[C.length-1]<1) return;
  const LL=pts=>pts.map(p=>pr.back(p[0],p[1]));
  let bb=[Infinity,Infinity,-Infinity,-Infinity]; for(const q of P){ bb[0]=Math.min(bb[0],q[0]); bb[1]=Math.min(bb[1],q[1]); bb[2]=Math.max(bb[2],q[0]); bb[3]=Math.max(bb[3],q[1]); }
  const info={id:w.id,t,hw,base,oneway,fwd,bwd,L,W,lo,hi,pr,P,C,nodes,bb};
  ways.set(w.id,info); stats.ways++;
  nodes.forEach((nid,i)=>{ let a=nodeIdx.get(nid); if(!a){a=[];nodeIdx.set(nid,a);} a.push([info,i]); });

  F.surf.push(feat('LineString',LL(offsetPts(P,(lo+hi)/2)),{w:hi-lo+0.5,id:w.id}));

  if(tagged||['motorway','trunk','primary','secondary','tertiary'].includes(base)){
    const add=(o,ty)=>F.mark.push(feat('LineString',LL(offsetPts(P,o)),{t:ty}));
    add(lo+0.3,'s'); add(hi-0.3,'s');
    if(oneway){ for(let k=1;k<L;k++) add(lo+k*W,'d'); }
    else{
      if(L>=4){ add(-0.13,'s'); add(0.13,'s'); } else add(0,L>=3?'s':'d');
      for(let k=1;k<fwd;k++) add(k*W,'d');
      for(let k=1;k<bwd;k++) add(-k*W,'d');
    }
  }
  // dönüş okları (turn:lanes)
  const arrows=(tl,pts,off)=>{
    const lanes=tl.split('|'), n=lanes.length;
    lanes.forEach((v,i)=>{
      if(!v||v==='none') return;
      const op=offsetPts(pts,off(i,n)), oc=cum(op), len=oc[oc.length-1];
      if(len<22) return;
      const ds=[len-15]; if(len>85) ds.push(len-48);
      for(const d of ds){ const a=along(op,oc,d); F.pts.push(feat('Point',pr.back(a.p[0],a.p[1]),{k:'arr',icon:'arr:'+combo(v),rot:a.ang/DEG})); stats.arr++; }
    });
  };
  if(oneway&&t['turn:lanes']) arrows(t['turn:lanes'],P,(i,n)=>-n*W/2+(i+0.5)*W);
  if(!oneway){
    if(t['turn:lanes:forward']) arrows(t['turn:lanes:forward'],P,i=>(i+0.5)*W);
    if(t['turn:lanes:backward']) arrows(t['turn:lanes:backward'],P.slice().reverse(),i=>(i+0.5)*W);
  }
  // hız sınırı levhası
  const ms=parseInt(t.maxspeed);
  if(ms&&C[C.length-1]>60){ const a=along(P,C,C[C.length-1]*0.35); const r=[Math.cos(a.ang),-Math.sin(a.ang)]; F.pts.push(feat('Point',pr.back(a.p[0]+r[0]*(hi+1.6),a.p[1]+r[1]*(hi+1.6)),{k:'sl',icon:'sl:'+ms})); }
  // yön tabelası (OSM destination etiketleri): yolun başına, sağ kenara
  const dt=dirText(t,oneway?'':':forward');
  if(dt&&C[C.length-1]>25){
    const a=along(P,C,Math.min(14,C[C.length-1]*0.3)), r=[Math.cos(a.ang),-Math.sin(a.ang)];
    F.pts.push(feat('Point',pr.back(a.p[0]+r[0]*(hi+2.2),a.p[1]+r[1]*(hi+2.2)),{k:'dsign',icon:dirIcon(dt,base)})); stats.dir++;
  }
  if(!oneway){ const db=dirText(t,':backward'); if(db&&C[C.length-1]>25){
    const a=along(P,C,Math.max(0,C[C.length-1]-14)), r=[Math.cos(a.ang),-Math.sin(a.ang)];
    F.pts.push(feat('Point',pr.back(a.p[0]-r[0]*(-lo+2.2),a.p[1]-r[1]*(-lo+2.2)),{k:'dsign',icon:dirIcon(db,base)})); stats.dir++; } }
}
function dirText(t,sfx){
  const d=t['destination'+sfx]||(sfx===':forward'?t.destination:''), ref=t['destination:ref'+sfx]||(sfx===':forward'?t['destination:ref']:'');
  if(!d&&!ref) return '';
  return [ref&&ref.split(';')[0],d&&d.split(';').slice(0,2).join(' / ')].filter(Boolean).join(' · ');
}
const dirIcon=(txt,base)=>(['motorway','trunk'].includes(base)||/\bO-\d/.test(txt)?'dirg:':'dir:')+encodeURIComponent(trunc(txt,30));

function processNode(n){
  if(!n.tags) return;
  placeNode(n.id,n.tags,(nodeIdx.get(n.id)||[]).map(([w,i])=>[w,w.C[i],i>0,i<w.P.length-1]),[n.lon,n.lat]);
}
// ents: [[yol, yol boyunca konum (m), öncesi var mı, sonrası var mı]]
function placeNode(id,tags,ents,ll){
  const hw=tags.highway;
  F.hit.push(feat('Point',ll,{nid:id,kind:hw}));
  const ak=alertOf(tags);
  if(ak) ALERTS.push({id,kind:ak,ll:ents.length?ents[0][0].pr.back(...along(ents[0][0].P,ents[0][0].C,ents[0][1]).p):ll});
  const pt=(w,a,off)=>{ const r=[Math.cos(a.ang),-Math.sin(a.ang)]; return w.pr.back(a.p[0]+r[0]*off,a.p[1]+r[1]*off); };
  const poly=(w,ring)=>F.poly.push(feat('Polygon',[ring.map(p=>w.pr.back(p[0],p[1]))]));
  const ph=ang=>{ const d=((ang/DEG)%180+180)%180; return (d>=45&&d<135)?6:0; };
  const side=(k,icon,off)=>{ if(!ents.length){ F.pts.push(feat('Point',ll,{k,icon})); return; } const [w,pos]=ents[0]; F.pts.push(feat('Point',pt(w,along(w.P,w.C,pos),w.hi+off),{k,icon})); };
  if(hw==='traffic_signals'){
    stats.sig++;
    const dir=tags['traffic_signals:direction']||tags.direction;
    if(!ents.length){ F.pts.push(feat('Point',ll,{k:'sig',off:0})); return; }
    for(const [w,pos,bef,aft] of ents){
      if(bef&&dir!=='backward'){
        const a=along(w.P,w.C,Math.max(0,pos-4)); const s0=w.oneway?w.lo:0;
        poly(w,rectXY(a,-0.25,0.25,s0+0.2,w.hi-0.2));
        F.pts.push(feat('Point',pt(w,a,w.hi+1.0),{k:'sig',off:ph(a.ang)}));
      }
      if(aft&&!w.oneway&&dir!=='forward'){
        const a=along(w.P,w.C,Math.min(w.C[w.C.length-1],pos+4));
        poly(w,rectXY(a,-0.25,0.25,w.lo+0.2,-0.2));
        F.pts.push(feat('Point',pt(w,a,w.lo-1.0),{k:'sig',off:ph(a.ang+Math.PI)}));
      }
    }
  } else if(hw==='crossing'){
    if(['unmarked','no'].includes(tags.crossing)||!ents.length) return;
    const [w,pos]=ents[0]; const a=along(w.P,w.C,pos); stats.cross++;
    for(let o=w.lo+0.4;o<w.hi-0.5;o+=1.1) poly(w,rectXY(a,-1.6,1.6,o,o+0.55));
  } else if(hw==='stop'||hw==='give_way') side('sign',hw==='stop'?'sg:stop':'sg:yield',1.3);
  else if(hw==='speed_sign') side('sign','sl:'+(parseInt(tags.maxspeed)||50),1.3);
  else if(hw==='sign') side('sign',tags.sign==='speed'?'sl:'+(parseInt(tags.maxspeed)||50):'sg:'+(tags.sign||'no_entry'),1.3);
  else if(hw==='dir_sign') side('dsign','dir:'+encodeURIComponent(String(tags.text||'Tabela').slice(0,24)),1.8);
  else if(hw==='speed_camera') { stats.warn++; side('sign','sg:camera',1.3); }
  else if(ak&&ak!=='signal'&&ak!=='crossing') { stats.warn++; side('sign','sg:'+alertSign(ak),1.3); }
}
function flush(){
  const fc=f=>({type:'FeatureCollection',features:f});
  map.getSource('ov-surf').setData(fc(F.surf)); map.getSource('ov-mark').setData(fc(F.mark));
  map.getSource('ov-poly').setData(fc(F.poly)); map.getSource('ov-pts').setData(fc(F.pts)); map.getSource('ed-hit').setData(fc(F.hit));
}

const DB_NAME='yolharita3b', DB_KEY='etimesgut-v2';   // v2: uyarı levhaları, kamera, kasis, hemzemin geçit
let DATA_AT=0;
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore('veri'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction('veri').objectStore('veri').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }

function areaParts(nx,ny){ const out=[], dx=(AREA.e-AREA.w)/nx, dy=(AREA.n-AREA.s)/ny; for(let j=0;j<ny;j++)for(let i=0;i<nx;i++) out.push([AREA.s+j*dy,AREA.w+i*dx,AREA.s+(j+1)*dy,AREA.w+(i+1)*dx].map(v=>v.toFixed(5)).join(',')); return out; }
const HW_RE='^(motorway|trunk|primary|secondary|tertiary|unclassified|residential|living_street|motorway_link|trunk_link|primary_link|secondary_link|tertiary_link)$';
const DEF_LV={house:2,detached:2,semidetached_house:2,terrace:2,bungalow:1,garage:1,garages:1,shed:1,hut:1,roof:1,carport:1,kiosk:1,container:1,service:1,transformer_tower:1,
  apartments:5,residential:4,dormitory:4,hotel:5,commercial:3,office:4,retail:2,supermarket:1,industrial:1,warehouse:1,school:3,university:4,college:3,kindergarten:2,hospital:5,
  mosque:1,religious:1,public:3,government:3,civic:3,train_station:1,construction:2,sports_hall:1,yes:3};
const DEF_H={supermarket:7,industrial:8,warehouse:9,mosque:11,religious:9,sports_hall:9,train_station:7,roof:4};
function bldBase(t){
  const lv=parseInt(t['building:levels']), h=parseFloat(t.height), mh=parseFloat(t.min_height)||(parseInt(t['building:min_level'])||0)*FLOOR_H;
  if(lv>0) return {lv,h:h||lv*FLOOR_H+(parseInt(t['roof:levels'])||0)*FLOOR_H*0.6,mh,est:0};
  if(h>0) return {lv:Math.max(1,Math.round(h/FLOOR_H)),h,mh,est:0};
  const d=DEF_LV[t.building]||3; return {lv:d,h:DEF_H[t.building]||d*FLOOR_H,mh,est:1};
}
const r6=v=>Math.round(v*1e6)/1e6;
function compactBld(el){
  const t=el.tags||{}; let polys=[];
  if(el.type==='way'&&el.geometry&&el.geometry.length>3) polys=[[el.geometry.map(g=>[r6(g.lon),r6(g.lat)])]];
  else if(el.type==='relation'&&el.members){
    const outer=[], inner=[];
    for(const m of el.members){ if(m.type!=='way'||!m.geometry||m.geometry.length<4) continue; const ring=m.geometry.map(g=>[r6(g.lon),r6(g.lat)]); const a=ring[0],b=ring[ring.length-1]; if(a[0]!==b[0]||a[1]!==b[1]) continue; (m.role==='inner'?inner:outer).push(ring); }
    polys=outer.map((o,i)=>i===0?[o,...inner]:[o]);
  }
  if(!polys.length) return null;
  const b=bldBase(t);
  return {id:el.type==='relation'?2e12+el.id:el.id,g:polys,lv:b.lv,h:+b.h.toFixed(1),mh:b.mh||0,est:b.est,t:t.building||'yes',n:t.name||t['addr:housenumber']&&((t['addr:street']||'')+' No:'+t['addr:housenumber'])||''};
}
const loadParts=new Map();
async function overpassRetry(q,label){
  let err;
  for(let k=0;k<3;k++){ try{ return await overpass(q,90000); }catch(e){ err=e; setLoad(`${label} · yeniden deneniyor (${k+2}/3)…`); await new Promise(r=>setTimeout(r,2500*(k+1))); } }
  throw err;
}
async function loadArea(force){
  showLoad(true,false);
  if(!force){
    const d=await idbGet(DB_KEY);
    if(d&&d.v===1&&d.roads&&d.roads.length){ ingest(d); showLoad(false); return; }
  } else loadParts.clear();
  const rp=areaParts(2,2).map(b=>['y'+b,`[out:json][timeout:80];(way["highway"~"${HW_RE}"](${b});node["highway"~"^(traffic_signals|stop|give_way|crossing|speed_camera)$"](${b});node["traffic_sign"](${b});node["hazard"](${b});node["traffic_calming"](${b});node["railway"="level_crossing"](${b}););out body geom;`,'Yollar']);
  const bp=areaParts(3,3).map(b=>['b'+b,`[out:json][timeout:90];(way["building"](${b});relation["building"]["type"="multipolygon"](${b}););out geom;`,'Binalar']);
  const all=[...rp,...bp]; let i=0;
  try{
    for(const [k,q,label] of all){
      i++;
      setLoad(`${label} indiriliyor · ${i}/${all.length}`,(i-1)/all.length);
      if(!loadParts.has(k)) loadParts.set(k,(await overpassRetry(q,label)).elements||[]);
    }
  }catch(e){ setLoad('OSM sunucuları şu an yanıt vermiyor. İndirilen parçalar duruyor; tekrar denersen kaldığı yerden devam eder.',(i-1)/all.length,true); return; }
  setLoad('Hazırlanıyor…',1);
  const roads=new Map(), nodes=new Map(), blds=new Map();
  for(const [k,els] of loadParts){
    for(const x of els){
      if(k[0]==='y'){ if(x.type==='way'&&x.tags&&x.geometry) roads.set(x.id,{type:'way',id:x.id,nodes:x.nodes,tags:x.tags,geometry:x.geometry.map(g=>({lat:r6(g.lat),lon:r6(g.lon)}))}); else if(x.type==='node'&&x.tags) nodes.set(x.id,{type:'node',id:x.id,lat:x.lat,lon:x.lon,tags:x.tags}); }
      else { const id=x.type==='relation'?2e12+x.id:x.id; if(!blds.has(id)){ const c=compactBld(x); if(c) blds.set(id,c); } }
    }
  }
  const d={v:1,at:Date.now(),roads:[...roads.values()],nodes:[...nodes.values()],blds:[...blds.values()]};
  const saved=await idbSet(DB_KEY,d);
  loadParts.clear(); ingest(d); showLoad(false);
  toast(saved?`Etimesgut indirildi ve kaydedildi · ${d.roads.length} yol, ${d.blds.length} bina`:'Veri indirildi ama tarayıcı saklamaya izin vermedi; bir dahaki açılışta yeniden indirilecek.',4500);
}
function ingest(d){

function applyBldEdits(){
  const src=map.getSource('b3'); if(!src||!BLD.size) return;
  const ids=new Set([...bApplied.keys(),...Object.keys(EDITS.blds).map(Number)]), upd=[];
  for(const id of ids){
    const b=BLD.get(id); if(!b) continue;
    const st=bldState(id), k=st.h+'|'+st.del, base=b.h+'|0', prev=bApplied.has(id)?bApplied.get(id):base;
    if(prev!==k) upd.push({id,addOrUpdateProperties:[{key:'render_height',value:st.h},{key:'del',value:st.del}]});
    if(k===base) bApplied.delete(id); else bApplied.set(id,k);
  }

async function overpass(q,tmo=20000){
  const one=async u=>{
    const ctl=new AbortController(); ctls.push(ctl); const to=setTimeout(()=>ctl.abort(),tmo);
    try{ const r=await fetch(u,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      if(!r.ok) throw new Error('HTTP '+r.status); const j=await r.json(); ovpBest=u; return j; }
    finally{ clearTimeout(to); }
  };
  const ctls=[];
  // son çalışan sunucu önce; 2,5 sn içinde dönmezse diğerleri de yarışa girer
  const list=ovpBest?[ovpBest,...OVP.filter(u=>u!==ovpBest)]:OVP;
  const first=one(list[0]);
  let done=false;
  const rest=new Promise(res=>setTimeout(res,tmo>30000?8000:2500)).then(()=>done?Promise.reject(new Error('gerek yok')):Promise.any(list.slice(1).map(one)));
  try{ return await Promise.any([first,rest]); }
  finally{ done=true; ctls.forEach(c=>c.abort()); }
}

  for(const [x,w,h] of sky) s+=`<rect x="${x}" y="${hz-h}" width="${w}" height="${h}" style="fill:var(--jv-city)"/>`;

/* ============ rota ve sürüş ============ */
const nav={route:null,d:0,v:0,driving:false,mult:1,last:0,camB:0,k:-1,jvMuted:-1,loadT:0,dest:null,destMarker:null};
function hav(a,b){ const R=6371000,dLa=(b[1]-a[1])*DEG,dLo=(b[0]-a[0])*DEG; const s=Math.sin(dLa/2)**2+Math.cos(a[1]*DEG)*Math.cos(b[1]*DEG)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function brg(a,b){ const y=Math.sin((b[0]-a[0])*DEG)*Math.cos(b[1]*DEG), x=Math.cos(a[1]*DEG)*Math.sin(b[1]*DEG)-Math.sin(a[1]*DEG)*Math.cos(b[1]*DEG)*Math.cos((b[0]-a[0])*DEG); return Math.atan2(y,x)/DEG; }
function segAt(R,d){ let lo=0,hi=R.cum.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(R.cum[m]<=d) lo=m; else hi=m; } return lo; }
function posAt(R,d){ const i=segAt(R,d), a=R.coords[i], b=R.coords[i+1]||a, s=(R.cum[i+1]-R.cum[i])||1, t=Math.min(1,Math.max(0,(d-R.cum[i])/s)); return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]; }
function durAt(R,d){ const i=segAt(R,d), s=(R.cum[i+1]-R.cum[i])||1, t=Math.min(1,Math.max(0,(d-R.cum[i])/s)); return R.cdur[i]+((R.cdur[i+1]??R.cdur[i])-R.cdur[i])*t; }
const lerpA=(a,b,t)=>{ let d=((b-a+540)%360)-180; return a+d*t; };
const fmtD=m=>m<950?`${Math.max(10,Math.round(m/10)*10)} m`:`${(m/1000).toFixed(m<9500?1:0).replace('.',',')} km`;
const modDir=m=>normDir(m||'straight');

function instr(st){
  const m=st.maneuver,t=m.type,mod=m.modifier||'straight';
  const M={left:'Sola dönün',right:'Sağa dönün','slight left':'Hafif sola dönün','slight right':'Hafif sağa dönün','sharp left':'Keskin sola dönün','sharp right':'Keskin sağa dönün',straight:'Düz devam edin',uturn:'U dönüşü yapın'};
  if(t==='arrive') return 'Hedefe ulaşın';
  if(t==='depart') return 'Yola çıkın';
  if(t==='roundabout'||t==='rotary') return m.exit?`Dönel kavşaktan ${m.exit}. çıkışı alın`:'Dönel kavşağa girin';
  if(t==='roundabout turn') return M[mod]||'Dönel kavşakta dönün';
  if(t==='exit roundabout'||t==='exit rotary') return 'Dönel kavşaktan çıkın';
  if(t==='fork') return mod.includes('left')?'Ayrımda soldan devam edin':mod.includes('right')?'Ayrımda sağdan devam edin':'Ayrımda düz devam edin';
  if(t==='off ramp') return mod.includes('left')?'Soldaki çıkışı alın':'Sağdaki çıkışı alın';
  if(t==='on ramp') return 'Bağlantı yoluna girin';
  if(t==='merge') return 'Trafiğe katılın';
  if(t==='end of road') return mod.includes('left')?'Yolun sonunda sola dönün':'Yolun sonunda sağa dönün';
  return M[mod]||'Devam edin';
}
const stepName=st=>[st.ref,st.name].filter(Boolean).join(' · ');
function stepLanes(R,k){
  const st=R.steps[k]; let L=st.intersections&&st.intersections[0]&&st.intersections[0].lanes;
  if(!L&&k>0){ const p=R.steps[k-1].intersections; L=p&&p[p.length-1].lanes; }
  return L?L.map(l=>({d:(l.indications||['straight']).map(normDir),on:!!l.valid})):null;
}

async function setDest(ll,label){
  nav.dest=ll;
  if(nav.destMarker) nav.destMarker.remove();
  const el=document.createElement('div'); el.className='dest-pin';
  nav.destMarker=new maplibregl.Marker({element:el,anchor:'bottom'}).setLngLat(ll).addTo(map);
  toast('Rota hesaplanıyor…',0);
  try{
    const j=await fetchRoute(carPos,ll);
    const rt=j.routes[0], coords=rt.geometry.coordinates, ann=rt.legs[0].annotation||{};
    const cumA=[0], cd=[0];
    for(let i=1;i<coords.length;i++){ cumA.push(cumA[i-1]+hav(coords[i-1],coords[i])); cd.push(cd[i-1]+((ann.duration&&ann.duration[i-1])||hav(coords[i-1],coords[i])/12)); }
    const steps=rt.legs[0].steps, tot=cumA[cumA.length-1];
    const sum=steps.reduce((a,s)=>a+s.distance,0)||1; const f=tot/sum;
    const ss=[]; let acc=0; for(const s of steps){ ss.push(acc*f); acc+=s.distance; }
    nav.route={coords,cum:cumA,cdur:cd,spd:ann.speed||[],maxs:ann.maxspeed||[],steps,stepStart:ss,total:tot,totalDur:cd[cd.length-1],label};
    nav.d=0; nav.v=0; nav.k=-1; nav.jvMuted=-1; nav.said=new Set(); nav.overT=0;
    routeAlerts(nav.route);
    map.getSource('route').setData(feat('LineString',coords));
    $('#trip').hidden=false; $('#bGo').textContent='Başlat';
    const b=coords.reduce((bb,c)=>bb.extend(c),new maplibregl.LngLatBounds(coords[0],coords[0]));
    map.fitBounds(b,{padding:{top:150,bottom:120,left:50,right:50},pitch:40,bearing:0,duration:900,maxZoom:17});
    updateNav(); const na=nav.route.alerts.length;
    toast(`${label||'Hedef'} · ${fmtD(tot)}`+(na?` · yol üzerinde ${na} uyarı`:''),3000);
  }catch(e){ console.error(e); toast('Rota alınamadı: '+(e.message||'bağlantı hatası'),5000); }
}
async function fetchRoute(a,b){
  const qs=`${a[0].toFixed(6)},${a[1].toFixed(6)};${b[0].toFixed(6)},${b[1].toFixed(6)}?overview=full&geometries=geojson&steps=true`;
  let last=new Error('yönlendirme sunucusuna ulaşılamadı');
  for(const base of ROUTERS){
    for(const ann of ['&annotations=distance,duration,speed,maxspeed','&annotations=distance,duration,speed','']){
      try{
        const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),12000);
        const r=await fetch(base+qs+ann,{signal:ctl.signal}); clearTimeout(to);
        const j=await r.json().catch(()=>({}));
        if(j.code==='Ok'&&j.routes&&j.routes.length) return j;
        if(j.code==='NoRoute'||j.code==='NoSegment'){ last=new Error('bu iki nokta arasında araç yolu yok'); break; }
        last=new Error(j.message||('sunucu hatası '+r.status));
        if(r.status!==400) break;
      }catch(e){ last=new Error(e.name==='AbortError'?'sunucu zaman aşımı':'bağlantı hatası'); break; }
    }
  }
  throw last;
}

function nextStep(R){ for(let k=0;k<R.steps.length;k++) if(R.stepStart[k]>nav.d+2) return k; return R.steps.length-1; }

/* ---- rota üzerindeki uyarılar: her uyarıyı rotaya izdüşür, rota boyunca konumunu bul ---- */
function routeAlerts(R){
  const kx=111320*Math.cos(R.coords[0][1]*DEG), ky=110574, o=R.coords[0];
  const xy=R.coords.map(c=>[(c[0]-o[0])*kx,(c[1]-o[1])*ky]);
  let bb=[Infinity,Infinity,-Infinity,-Infinity]; for(const q of xy){ bb[0]=Math.min(bb[0],q[0]); bb[1]=Math.min(bb[1],q[1]); bb[2]=Math.max(bb[2],q[0]); bb[3]=Math.max(bb[3],q[1]); }
  const out=[];
  for(const a of ALERTS){
    const p=[(a.ll[0]-o[0])*kx,(a.ll[1]-o[1])*ky];
    if(p[0]<bb[0]-20||p[0]>bb[2]+20||p[1]<bb[1]-20||p[1]>bb[3]+20) continue;
    let best=Infinity, bd=0;
    for(let i=0;i<xy.length-1;i++){
      const A=xy[i],B=xy[i+1],dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy||1;
      const t=Math.max(0,Math.min(1,((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L2));
      const ex=A[0]+dx*t-p[0], ey=A[1]+dy*t-p[1], d2=ex*ex+ey*ey;
      if(d2<best){ best=d2; bd=R.cum[i]+(R.cum[i+1]-R.cum[i])*t; }
    }
    if(best>(a.kind==='camera'?30*30:14*14)) continue;
    if(bd<5||bd>R.total-5) continue;
    out.push({kind:a.kind,d:bd,ll:a.ll});
  }
  out.sort((a,b)=>a.d-b.d);
  // aynı kavşaktaki aynı türden uyarıları birleştir
  const al=[]; for(const a of out){ const prev=al.findLast(x=>x.kind===a.kind); if(prev&&a.d-prev.d<45) continue; al.push(a); }
  R.alerts=al;
  map.getSource('rt-al').setData({type:'FeatureCollection',features:al.map(a=>feat('Point',a.ll,{kind:a.kind}))});
}
function showAlerts(R){
  const box=$('#alerts'), list=(R.alerts||[]).filter(a=>{ const dm=a.d-nav.d; return dm>-3&&dm<=ALERT_KIND[a.kind][2]; }).slice(0,2);
  const key=list.map(a=>a.kind+a.d).join('|');
  if(box.dataset.key!==key){
    box.dataset.key=key;
    box.innerHTML=list.map(a=>`<div class="alert panel" data-d="${a.d}"><img src="${badgeURL(a.kind)}" alt=""><div><b></b><span>${ALERT_KIND[a.kind][0]}</span></div></div>`).join('');
  }
  box.querySelectorAll('.alert').forEach(el=>{ const dm=Math.max(0,+el.dataset.d-nav.d); el.querySelector('b').textContent=dm<15?'Şimdi':fmtD(dm); el.classList.toggle('hot',dm<80); });
  // konum: geniş ekranda arama kutusunun, dar ekranda manevra tabelasının altına
  const anchor=innerWidth<=760?$('#maneuver'):$('#search');
  if(anchor&&!anchor.hidden&&getComputedStyle(anchor).display!=='none') box.style.top=(anchor.getBoundingClientRect().bottom+8)+'px';
  if(nav.driving) for(const a of list){
    const id='a'+a.kind+Math.round(a.d), dm=a.d-nav.d;
    if(!nav.said.has(id)&&dm>20){ nav.said.add(id); say(`${sayD(dm)} ileride ${ALERT_KIND[a.kind][0].toLocaleLowerCase('tr-TR')}`); }
  }
}
/* ---- aracın bulunduğu yol (yerel şerit verisinden) ---- */
function wayAt(ll,bear){
  let best=null, bd=12;
  for(const w of ways.values()){
    const p=w.pr.fwd(ll); if(p[0]<w.bb[0]-bd||p[0]>w.bb[2]+bd||p[1]<w.bb[1]-bd||p[1]>w.bb[3]+bd) continue;
    for(let i=0;i<w.P.length-1;i++){
      const A=w.P[i],B=w.P[i+1],dx=B[0]-A[0],dy=B[1]-A[1],L2=dx*dx+dy*dy||1;
      const t=Math.max(0,Math.min(1,((p[0]-A[0])*dx+(p[1]-A[1])*dy)/L2));
      const d=Math.hypot(A[0]+dx*t-p[0],A[1]+dy*t-p[1]);
      const ang=Math.atan2(dx,dy)/DEG, diff=Math.abs(((bear-ang+540)%360)-180);
      const pen=d+(w.oneway&&diff>100?20:0)+Math.min(diff,180-diff)*0.05;
      if(pen<bd){ bd=pen; best={w,fwd:diff<=90}; }
    }
  }
  return best;
}
function showRoad(R){

  const w=nav.way, i=segAt(R,nav.d);
  let step=R.steps[0]; for(let k=0;k<R.steps.length;k++) if(R.stepStart[k]<=nav.d+1) step=R.steps[k];
  const name=(w&&(w.t.name||w.t.ref))||stepName(step);
  const n=w?(w.oneway?w.L:(nav.wayFwd?w.fwd:w.bwd)):0;
  $('#road').hidden=!(name||n);
  $('#rName').textContent=name||'İsimsiz yol';
  $('#rLanes').innerHTML=n?`<i>${'<u></u>'.repeat(Math.min(n,6))}</i>${n} şerit`:'';

function updateNav(){
  const R=nav.route; if(!R) return;
  const k=nextStep(R), st=R.steps[k], dm=Math.max(0,R.stepStart[k]-nav.d);
  const m=st.maneuver, arrive=m.type==='arrive';
  // manevra tabelası
  $('#maneuver').hidden=false;
  if(k!==nav.k){
    nav.k=k;
    $('#mIcon').innerHTML=arrive?'<circle cx="50" cy="40" r="16" fill="none" stroke="#fff" stroke-width="9"/><path d="M50 58 50 92" stroke="#fff" stroke-width="9"/>':arrowSVG([modDir(m.modifier)],'#fff',11);
    $('#mText').textContent=instr(st);
    $('#mStreet').textContent=arrive?(R.label||''):(st.destinations||stepName(st)||'');
    const L=stepLanes(R,k), box=$('#mLanes');
    if(L&&L.length>1){ box.hidden=false; box.innerHTML=L.map((l,i)=>(i?'<i class="sep"></i>':'')+`<svg viewBox="0 0 100 100">${arrowSVG(l.d,l.on?'#fff':'rgba(255,255,255,.32)',10)}</svg>`).join(''); }
    else box.hidden=true;
  }
  $('#mDist').textContent=arrive&&dm<15?'Vardınız':fmtD(dm);
  // kavşak görünümü
  const big=['turn','fork','off ramp','on ramp','end of road','roundabout','rotary','merge'].includes(m.type)||(m.type==='continue'&&m.modifier&&m.modifier!=='straight');
  const L=stepLanes(R,k);
  if(nav.driving&&!arrive&&dm<380&&(L||big)&&nav.jvMuted!==k){
    const lanes=L||[{d:[modDir(m.modifier)],on:true}];
    const dest=st.destinations?st.destinations.split(',')[0]:(st.name||instr(st));
    showJV('step'+k,instr(st),stepName(st),lanes,{title:dest,sub:st.ref||(st.destinations&&st.name)||'',kind:/^O-|otoyol/i.test((st.ref||'')+st.name)?'motorway':'road',dir:modDir(m.modifier)},fmtD(dm));
  } else if(jvKey&&jvKey.startsWith('step')) hideJV();
  // sesli yönlendirme
  const plain=m.type==='depart'||(['continue','new name','notification'].includes(m.type)&&(!m.modifier||m.modifier==='straight'));
  if(nav.driving&&!arrive&&!plain){
    const verb=instr(st), low=verb.charAt(0).toLocaleLowerCase('tr-TR')+verb.slice(1);
    if(dm<=400&&dm>150&&!nav.said.has('f'+k)){ nav.said.add('f'+k); say(`${sayD(dm)} sonra ${low}`+(st.name?`, ${st.name}`:'')); }
    else if(dm<=70&&!nav.said.has('n'+k)){ nav.said.add('n'+k); nav.said.add('f'+k); say(verb); }
  }
  // yaklaşan uyarılar
  showAlerts(R);
  // mevcut yol ve şerit sayısı
  showRoad(R);
  // yolculuk şeridi
  const i=segAt(R,nav.d), ms=R.maxs[i];
  const lim=$('#tLimit');
  let limit=ms&&ms.speed?(ms.unit==='mph'?Math.round(ms.speed*1.609):ms.speed):0;
  if(!limit&&nav.way) limit=parseInt(nav.way.t.maxspeed)||0;
  if(limit){ lim.textContent=limit; lim.className='sl'; } else { lim.textContent='—'; lim.className='sl none'; }
  const kmh=Math.round(nav.v*3.6), over=nav.driving&&limit&&kmh>limit+3;
  $('#tSpeed').textContent=kmh; lim.classList.toggle('over',!!over); $('#tSpeed').parentElement.classList.toggle('over',!!over);
  if(over&&Date.now()-nav.overT>20000){ nav.overT=Date.now(); say(`Hız sınırı ${limit}. Lütfen yavaşlayın`); }
  const rest=R.totalDur-durAt(R,nav.d), arr=new Date(Date.now()+rest*1000);
  $('#tEta').textContent=arr.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
  $('#tRest').textContent=`${fmtD(R.total-nav.d)} · ${Math.max(1,Math.round(rest/60))} dk kaldı`;
}

function tick(ts){
  if(!nav.driving||!nav.route) return;
  const R=nav.route, dt=Math.min(0.1,(ts-(nav.last||ts))/1000); nav.last=ts;
  const i=segAt(R,nav.d); let tgt=Math.min(33,Math.max(5,R.spd[i]||12));
  const k=nextStep(R), st=R.steps[k], dm=R.stepStart[k]-nav.d, mod=st.maneuver.modifier||'';
  if(/left|right|uturn/.test(mod)&&!['depart','arrive'].includes(st.maneuver.type)&&dm<70) tgt=Math.min(tgt,6+dm*0.12);
  if(st.maneuver.type==='arrive'&&dm<80) tgt=Math.min(tgt,3+dm*0.15);
  nav.v+=(tgt-nav.v)*Math.min(1,dt*0.9);
  nav.d+=nav.v*dt*nav.mult;
  if(nav.d>=R.total-1){ nav.d=R.total; nav.driving=false; $('#bGo').textContent='Baştan'; toast('Hedefe ulaştınız',3000); say('Hedefinize ulaştınız'); }
  const p=posAt(R,nav.d), q=posAt(R,Math.min(R.total,nav.d+22)); const b=hav(p,q)>1?brg(p,q):carB;
  nav.camB=lerpA(nav.camB,b,Math.min(1,dt*2.2*Math.sqrt(nav.mult)));
  setCar(p,b);
  map.jumpTo({center:p,bearing:nav.camB,pitch:60,zoom:17.7,padding:{top:innerHeight*0.42,bottom:0,left:0,right:0}});
  if(ts-nav.loadT>1500){ nav.loadT=ts; wantCells(posAt(R,Math.min(R.total,nav.d+250))); }
  if(ts-(nav.uiT||0)>200){ nav.uiT=ts; updateNav(); }
  if(nav.driving) requestAnimationFrame(tick);
}

/* ============ DÜZENLEYİCİ ============
   Düzenlemeler OSM verisinin ÜSTÜNDE ayrı bir katman olarak tutulur.
   Ham veri (RAW) hiç değişmez; harita her seferinde "ham + düzenlemeler"den yeniden kurulur.
   Bir düzenleme çizilemezse yalnızca o atlanır, harita çalışmaya devam eder. */
const ED_KEY='yolharita3b.etimesgut.duzenlemeler.v1';
const FLOOR_H=3.2;
const blankEdits=()=>({ways:{},roads:[],points:[],delNodes:[],blds:{},newBlds:[]});
let EDITS=blankEdits();
const ED={signType:'speed',signSpeed:50,on:false,tool:'select',sel:null,draw:null,undo:[],redo:[],show:true,errs:0,saveOk:true};
const KIND_TR={traffic_signals:'Trafik ışığı',crossing:'Yaya geçidi',sign:'Trafik levhası',dir_sign:'Yön tabelası',stop:'DUR levhası',give_way:'Yol ver levhası',speed_sign:'Hız sınırı levhası'};
const POINT_TOOLS=['traffic_signals','crossing','sign','dir_sign'];
const CLS=[['motorway','Otoyol'],['trunk','Bölünmüş ana yol'],['primary','Birinci derece'],['secondary','İkinci derece'],['tertiary','Üçüncü derece'],['unclassified','Bağlantı yolu'],['residential','Mahalle arası'],['living_street','Yaya öncelikli']];
const TURN_OPTS=['through','left','left;through','right','through;right','left;right','left;through;right','slight_left','slight_right','reverse','none'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function cleanEdits(o){
  const e=blankEdits(), obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
  if(!obj(o)) return e;
  if(obj(o.ways)) for(const k in o.ways) if(obj(o.ways[k])) e.ways[k]=o.ways[k];
  if(Array.isArray(o.roads)) e.roads=o.roads.filter(r=>r&&r.id&&Array.isArray(r.coords)&&r.coords.length>1&&obj(r.tags)&&r.tags.highway);
  if(Array.isArray(o.points)) e.points=o.points.filter(p=>p&&p.id&&Array.isArray(p.ll)&&obj(p.tags));
  if(Array.isArray(o.delNodes)) e.delNodes=o.delNodes.filter(x=>typeof x==='number');
  if(obj(o.blds)) for(const k in o.blds) if(obj(o.blds[k])) e.blds[k]=o.blds[k];
  if(Array.isArray(o.newBlds)) e.newBlds=o.newBlds.filter(b=>b&&b.id&&Array.isArray(b.ring)&&b.ring.length>3);
  return e;
}
function loadEdits(){
  let s=null;
  try{ s=localStorage.getItem(ED_KEY); }catch(e){ ED.saveOk=false; return; }
  if(!s) return;
  try{ const j=JSON.parse(s); EDITS=cleanEdits(j.edits||j); }
  catch(e){ try{ localStorage.setItem(ED_KEY+'.bozuk',s); }catch(_){} toast('Kayıtlı düzenlemeler okunamadı; bozuk kopya ayrıca saklandı.',5000); }
}
function saveEdits(){
  try{ localStorage.setItem(ED_KEY,JSON.stringify({v:1,saved:new Date().toISOString(),edits:EDITS})); ED.saveOk=true; }
  catch(e){ ED.saveOk=false; }
  edInfo();
}
const editCount=()=>Object.keys(EDITS.ways).length+EDITS.roads.length+EDITS.points.length+EDITS.delNodes.length+Object.keys(EDITS.blds).length+EDITS.newBlds.length;

function commit(fn){
  const before=JSON.stringify(EDITS), selBefore=ED.sel;
  try{ fn(EDITS); }
  catch(e){ console.error(e); EDITS=JSON.parse(before); ED.sel=selBefore; toast('Bu değişiklik yapılamadı; harita olduğu gibi kaldı.',3000); return; }
  ED.undo.push(before); if(ED.undo.length>200) ED.undo.shift(); ED.redo=[];
  saveEdits(); rebuild(); edPanel();
}
function undo(){ if(!ED.undo.length) return; ED.redo.push(JSON.stringify(EDITS)); EDITS=JSON.parse(ED.undo.pop()); saveEdits(); rebuild(); edPanel(); toast('Geri alındı',1200); }
function redo(){ if(!ED.redo.length) return; ED.undo.push(JSON.stringify(EDITS)); EDITS=JSON.parse(ED.redo.pop()); saveEdits(); rebuild(); edPanel(); }

/* ---- yeniden kurma ---- */
const patchTags=(t,p)=>{ const o={...t}; for(const k in p){ if(p[k]===null||p[k]==='') delete o[k]; else o[k]=String(p[k]); } return o; };
function safe(fn){ try{ fn(); }catch(e){ ED.errs++; console.warn(e); } }
let rbT=null;
function scheduleRebuild(){ clearTimeout(rbT); rbT=setTimeout(rebuild,40); }
function rebuild(){
  clearTimeout(rbT);
  F.surf=[];F.mark=[];F.poly=[];F.pts=[];F.hit=[]; ways.clear(); nodeIdx.clear();
  Object.assign(stats,{ways:0,sig:0,cross:0,arr:0,warn:0,dir:0}); ED.errs=0; ALERTS.length=0;
  const E=ED.show?EDITS:null;
  for(const w of RAW.ways.values()) safe(()=>processWay(E&&E.ways[w.id]?{...w,tags:patchTags(w.tags,E.ways[w.id])}:w));
  if(E) for(const r of E.roads) safe(()=>processWay({id:r.id,tags:r.tags,geometry:r.coords.map(c=>({lon:c[0],lat:c[1]})),nodes:[]}));
  const del=E?new Set(E.delNodes):null;
  for(const n of RAW.nodes.values()) if(!(del&&del.has(n.id))) safe(()=>processNode(n));
  if(E) for(const p of E.points) safe(()=>placeNode(p.id,p.tags,userEnts(p.ll),p.ll));
  try{ flush(); renderEdLayers(); drawSel(); }catch(e){ console.error(e); }
  if(nav.route) routeAlerts(nav.route);
  if(RAW.ways.size||(E&&E.roads.length)) status(ED.errs?'err':'ok',statText()+(ED.errs?` · ${ED.errs} öğe çizilemedi`:'')+(!ED.show?' · ORİJİNAL GÖRÜNÜM':''));
}

/* ---- kullanıcı noktasını en yakın yola oturt ---- */
function snapToWay(ll,maxD=25){
  let best=null;
  for(const w of ways.values()){
    const q=w.pr.fwd(ll), b=w.bb;
    if(q[0]<b[0]-maxD||q[0]>b[2]+maxD||q[1]<b[1]-maxD||q[1]>b[3]+maxD) continue;
    const P=w.P;
    for(let i=1;i<P.length;i++){
      const a=P[i-1],c=P[i],dx=c[0]-a[0],dy=c[1]-a[1],L2=dx*dx+dy*dy||1e-9;
      const t=clamp(((q[0]-a[0])*dx+(q[1]-a[1])*dy)/L2,0,1);
      const d=Math.hypot(a[0]+dx*t-q[0],a[1]+dy*t-q[1]);
      if(d<maxD&&(!best||d<best.d)) best={w,i,pos:w.C[i-1]+Math.sqrt(L2)*t,d};
    }
  }
  return best;
}
function userEnts(ll){
  const s=snapToWay(ll); if(!s) return [];
  const w=s.w, len=w.C[w.C.length-1];
  // kavşak düğümüne yakınsa o kavşaktaki tüm yollara uygula
  for(const j of [s.i-1,s.i]){
    const nid=w.nodes[j];
    if(nid!=null&&Math.abs(w.C[j]-s.pos)<8){ const e=nodeIdx.get(nid); if(e&&e.length>1) return e.map(([w2,k])=>[w2,w2.C[k],k>0,k<w2.P.length-1]); }
  }
  return [[w,s.pos,s.pos>3,s.pos<len-3]];
}

/* ---- düzenleme katmanları ---- */
function renderEdLayers(){
  const fs=[];
  if(ED.show) for(const b of EDITS.newBlds) fs.push(feat('Polygon',[b.ring],{bid:b.id,render_height:b.levels*FLOOR_H}));
  map.getSource('ed-bld').setData({type:'FeatureCollection',features:fs});
  applyBldEdits();
}
function bldData(s){
  const nb=EDITS.newBlds.find(b=>b.id===s.id);
  if(nb) return {isNew:true,levels:nb.levels,geom:[[nb.ring]],edited:true};
  const b=BLD.get(s.id); if(!b) return null;
  const e=EDITS.blds[s.id];
  return {levels:(e&&e.levels)||b.lv,geom:b.g,h0:b.h,lv0:b.lv,est:b.est,type:b.t,name:b.n,del:!!(e&&e.del),edited:!!e};
}
function selFeatures(){
  const s=ED.sel; if(!s||!ED.on) return [];
  if(s.type==='way'){ const f=F.surf.find(f=>f.properties.id===s.id); return f?[feat('LineString',f.geometry.coordinates,{t:'line',w:f.properties.w+1.6})]:[]; }
  if(s.type==='pt'){ const f=F.hit.find(f=>f.properties.nid===s.id); return f?[feat('Point',f.geometry.coordinates,{t:'pt'})]:[]; }
  if(s.type==='bld'){ const b=bldData(s); if(!b||!b.geom) return []; const h=b.del?0.3:b.levels*FLOOR_H; return b.geom.map(p=>feat('Polygon',p,{t:'cap',h})); }
  return [];
}
function drawSel(){ const src=map.getSource('ed-sel'); if(src) src.setData({type:'FeatureCollection',features:selFeatures()}); }
function drawUpdate(){
  const d=ED.draw, fs=[];
  if(d&&d.pts.length){
    const P=d.pts;
    if(d.type==='bld'&&P.length>=3) fs.push(feat('Polygon',[[...P,P[0]]],{}));
    if(P.length>=2) fs.push(feat('LineString',d.type==='bld'&&P.length>=3?[...P,P[0]]:P,{}));
    P.forEach((p,i)=>fs.push(feat('Point',p,{first:i===0?1:0})));
  }
  map.getSource('ed-draw').setData({type:'FeatureCollection',features:fs});
  edHint();
}

/* ---- değişiklik yardımcıları ---- */
function setTags(id,obj){
  commit(E=>{
    const r=E.roads.find(r=>r.id===id);
    if(r){ for(const k in obj){ if(obj[k]===undefined) continue; if(obj[k]===null) delete r.tags[k]; else r.tags[k]=String(obj[k]); } return; }
    const orig=(RAW.ways.get(id)||{}).tags||{}, p=E.ways[id]||(E.ways[id]={});
    for(const k in obj){
      if(obj[k]===undefined) continue;
      const v=obj[k]===null?null:String(obj[k]);
      if((v===null&&orig[k]===undefined)||v===orig[k]) delete p[k]; else p[k]=v;
    }
    if(!Object.keys(p).length) delete E.ways[id];
  });
}
const resizeLanes=(str,n)=>{ if(str==null) return undefined; const a=str.split('|'); while(a.length<n) a.push(''); return a.slice(0,n).join('|'); };
function setBld(s,fn){
  commit(E=>{
    const nb=E.newBlds.find(b=>b.id===s.id); if(nb){ fn(nb,true); return; }
    const b=BLD.get(s.id); if(!b) return;
    const e=E.blds[s.id]||(E.blds[s.id]={});
    fn(e,false);
    if(!e.del&&(!e.levels||e.levels===b.lv)) delete E.blds[s.id];   // OSM değerine dönünce düzenleme kaydı silinir
  });
}
function addPoint(kind,ll){
  const tags={highway:kind};
  if(kind==='crossing') tags.crossing='zebra';
  if(kind==='sign'){ tags.sign=ED.signType; if(ED.signType==='speed') tags.maxspeed=String(ED.signSpeed||50); }
  if(kind==='dir_sign') tags.text='Etimesgut';
  const id=newId('p'); ED.sel={type:'pt',id};
  commit(E=>E.points.push({id,ll,tags}));
  setTool('select');
}
function finishDraw(){
  const d=ED.draw; if(!d) return;
  let pts=d.pts.filter((p,i,a)=>!i||hav(p,a[i-1])>0.8);
  if(d.type==='road'){
    if(pts.length<2){ toast('Yol için en az 2 nokta gerekli',2000); return; }
    for(const k of [0,pts.length-1]){ const s=snapToWay(pts[k],7); if(s){ const a=along(s.w.P,s.w.C,s.pos); pts[k]=s.w.pr.back(a.p[0],a.p[1]); } }
    const id=newId('u'); ED.sel={type:'way',id};
    commit(E=>E.roads.push({id,coords:pts,tags:{highway:'residential',lanes:'2',oneway:'no',name:'Yeni yol'}}));
  } else {
    if(pts.length<3){ toast('Bina için en az 3 köşe gerekli',2000); return; }
    const id=newId('b'); ED.sel={type:'bld',id};
    commit(E=>E.newBlds.push({id,ring:[...pts,pts[0]],levels:4}));
  }
  ED.draw=null; setTool('select');
}

/* ---- seçim ---- */
function pick(p){
  const box=r=>[[p.x-r,p.y-r],[p.x+r,p.y+r]];
  let f=map.queryRenderedFeatures(box(12),{layers:['ed-hit']})[0];
  if(f) return {type:'pt',id:f.properties.nid};
  f=map.queryRenderedFeatures(p,{layers:['ed-bld','b3']})[0];
  if(f) return f.layer.id==='ed-bld'?{type:'bld',id:f.properties.bid}:{type:'bld',id:f.id};
  f=map.queryRenderedFeatures(box(10),{layers:['ov-surf']})[0];
  if(f) return {type:'way',id:f.properties.id};
  if(!BLD.size&&map.queryRenderedFeatures(p,{layers:['bld']}).length) toast('Bina verisi yüklenmedi; binalar şu an düzenlenemez',2500);
  return null;
}
function select(s){ ED.sel=s; drawSel(); edPanel(); }

/* ---- haritaya tıklama (düzenleme modunda) ---- */
function edClick(e){
  const ll=[e.lngLat.lng,e.lngLat.lat];
  if(!ED.show){ toast('Önce "Orijinal" görünümünü kapat',2000); return; }
  const t=ED.tool;
  if(ED.draw){ ED.draw.pts.push(ll); drawUpdate(); return; }
  if(POINT_TOOLS.includes(t)){ addPoint(t,ll); return; }
  if(t==='move'){ moveSel(ll); return; }
  select(pick(e.point));
}
function moveSel(ll){
  const s=ED.sel; setTool('select'); if(!s||s.type!=='pt') return;
  commit(E=>{
    if(typeof s.id==='string'){ const p=E.points.find(p=>p.id===s.id); if(p) p.ll=ll; }
    else { const n=RAW.nodes.get(s.id); if(!n) return; E.delNodes.push(s.id); const id=newId('p'); E.points.push({id,ll,tags:{...n.tags}}); ED.sel={type:'pt',id}; }
  });
}

/* ---- araçlar ---- */
const HINTS={road:'Yolun geçeceği noktalara sırayla dokun',bld:'Binanın köşelerine sırayla dokun',move:'Yeni yerine dokun',
  traffic_signals:'Işığı koyacağın yere dokun; en yakın yola ya da kavşağa oturur',crossing:'Yaya geçidini koyacağın yere dokun; yolu enine keser',
  sign:'Levhayı seç, sonra yolun kenarına dokun',dir_sign:'Yön tabelasının yerine dokun'};
const signGrid=(cur,act)=>`<div class="sgrid">${SIGNS.map(([k,n])=>`<button ${act}="${k}" class="${k===cur?'on':''}" title="${n}"><img src="${signURL(k)}" alt="${n}"></button>`).join('')}</div>`;
function setTool(t){
  ED.tool=t; ED.draw=(t==='road'||t==='bld')?{type:t,pts:[]}:null;
  document.querySelectorAll('#edbar [data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
  try{ if(ED.draw||t==='move') map.doubleClickZoom.disable(); else map.doubleClickZoom.enable(); }catch(e){}
  drawUpdate();
}
function edHint(){
  const h=$('#edhint'), t=ED.tool;
  if(!ED.on||t==='select'){ h.hidden=true; return; }
  const n=ED.draw?ED.draw.pts.length:0;
  h.classList.toggle('wide',t==='sign');
  h.innerHTML=`<span>${HINTS[t]||''}${ED.draw?` · <b>${n}</b> nokta`:''}${t==='sign'?` · <b>${SIGN_TR[ED.signType]}</b>`:''}</span>`+(t==='sign'?signGrid(ED.signType,'data-sg'):'')+
    (ED.draw?`<button class="btn" data-h="back" ${n?'':'disabled'}>Son noktayı sil</button><button class="btn primary" data-h="done" ${n>=(t==='bld'?3:2)?'':'disabled'}>Bitir</button>`:'')+
    `<button class="btn" data-h="cancel">İptal</button>`;
  h.hidden=false;
}
$('#edhint').addEventListener('click',e=>{
  const g=e.target.closest('[data-sg]'); if(g){ ED.signType=g.dataset.sg; edHint(); return; }
  const b=e.target.closest('[data-h]'); if(!b) return;
  if(b.dataset.h==='back'&&ED.draw){ ED.draw.pts.pop(); drawUpdate(); }
  if(b.dataset.h==='done') finishDraw();
  if(b.dataset.h==='cancel') setTool('select');
});

/* ---- özellik paneli ---- */
const laneBtn=(v,act)=>{ const has=v&&v!=='none'; return `<button ${act} title="${has?esc(v):'Ok yok'}"><svg viewBox="0 0 100 100">${has?arrowSVG(combo(v).split(';'),'#fff',10):'<path d="M38 50h24" stroke="rgba(255,255,255,.4)" stroke-width="6"/>'}</svg></button>`; };
const stepper=(label,k,v,shown)=>`<div class="f"><span>${label}</span><div class="step"><button data-act="st" data-k="${k}" data-d="-1" aria-label="Azalt">−</button><b>${shown??v}</b><button data-act="st" data-k="${k}" data-d="1" aria-label="Artır">+</button></div></div>`;
function lanesRow(label,key,n,t){
  const a=(t[key]||'').split('|'); while(a.length<n) a.push('');
  return `<div class="blk"><span>${label}</span><div class="lanes">${a.slice(0,n).map((v,i)=>laneBtn(v,`data-act="turn" data-k="${key}" data-i="${i}" data-n="${n}"`)).join('')}</div></div>`;
}
function wayPanelHTML(w){
  const t=w.t, isUser=typeof w.id==='string', edited=isUser||!!EDITS.ways[w.id], ms=parseInt(t.maxspeed)||0, rb=['roundabout','circular'].includes(t.junction);
  let h=`<header class="edh"><div><small>${isUser?'Senin eklediğin yol':'OSM yolu'}${edited&&!isUser?' · düzenlendi':''}</small><h3>${esc(t.name||t.ref||'İsimsiz yol')}</h3></div><button data-act="close" aria-label="Kapat">×</button></header>`;
  h+=`<label class="f"><span>Ad</span><input id="edName" value="${esc(t.name||'')}" placeholder="Yol adı"></label>`;
  h+=`<label class="f"><span>Tür</span><select id="edCls">${CLS.map(([k,n])=>`<option value="${k}" ${w.base===k?'selected':''}>${n}</option>`).join('')}</select></label>`;
  h+=`<div class="f"><span>Yön</span><div class="seg"><button data-act="oneway" data-v="0" class="${!w.oneway?'on':''}" ${rb?'disabled':''}>Çift yön</button><button data-act="oneway" data-v="1" class="${w.oneway?'on':''}">Tek yön</button>${w.oneway?'<button data-act="flip">Çevir</button>':''}</div></div>`;
  if(w.oneway) h+=stepper('Şerit sayısı','lanes1',w.L);
  else h+=stepper('İleri şerit','fwd',w.fwd)+stepper('Geri şerit','bwd',w.bwd);
  h+=stepper('Hız sınırı','ms',ms,ms?ms+' km/s':'Yok');
  h+=`<div class="chips">${[30,50,70,82,90,110,120].map(v=>`<button data-act="msset" data-v="${v}" class="${v===ms?'on':''}">${v}</button>`).join('')}<button data-act="msset" data-v="0" class="${!ms?'on':''}">Yok</button></div>`;
  if(w.oneway) h+=lanesRow('Şerit okları · soldan sağa · dokundukça değişir','turn:lanes',w.L,t);
  else h+=lanesRow('İleri yön okları · soldan sağa','turn:lanes:forward',w.fwd,t)+lanesRow('Geri yön okları · soldan sağa','turn:lanes:backward',w.bwd,t);
  h+=`<p class="hint">Haritadaki mavi oklar "ileri" yönü gösterir.</p>`;
  const acts=[];
  if(edited&&!isUser) acts.push('<button class="btn" data-act="resetway">OSM haline döndür</button>');
  if(isUser) acts.push('<button class="btn danger" data-act="delway">Yolu sil</button>');
  if(acts.length) h+=`<div class="acts">${acts.join('')}</div>`;
  return h;
}
const BTYPE={house:'Müstakil ev',detached:'Müstakil ev',apartments:'Apartman',residential:'Konut',commercial:'Ticari',retail:'Dükkân',office:'Ofis',industrial:'Sanayi',warehouse:'Depo',school:'Okul',university:'Üniversite',hospital:'Hastane',mosque:'Cami',garage:'Garaj',garages:'Garajlar',shed:'Kulübe',public:'Kamu binası',government:'Kamu binası',supermarket:'Market',hotel:'Otel',construction:'İnşaat',yes:'Bina'};
function bldPanelHTML(s){
  const b=bldData(s); if(!b) return null;
  const kind=b.isNew?'Senin eklediğin bina':(BTYPE[b.type]||'Bina');
  let h=`<header class="edh"><div><small>${kind}${b.edited&&!b.isNew?' · düzenlendi':''}</small><h3>${b.del?'Kaldırıldı':esc(b.name||b.levels+' katlı bina')}</h3></div><button data-act="close" aria-label="Kapat">×</button></header>`;
  if(b.del) return h+`<p class="hint">Bu bina haritadan kaldırıldı.</p><div class="acts"><button class="btn" data-act="bldreset">Geri getir</button></div>`;
  h+=stepper('Kat sayısı','lv',b.levels);
  h+=`<div class="chips">${[1,2,3,4,5,6,8,10,12,15,20,30].map(n=>`<button data-act="lvset" data-v="${n}" class="${n===b.levels?'on':''}">${n}</button>`).join('')}</div>`;
  h+=`<p class="hint">Yükseklik ≈ ${(b.edited||b.isNew?b.levels*FLOOR_H:b.h0).toFixed(1).replace('.',',')} m`+(b.isNew?'':` · OSM'deki: ${b.lv0} kat ${b.est?'<b class="warn">(OSM’de kat yok, tahmini)</b>':''}`)+`</p>`;
  h+=`<div class="acts">${b.edited&&!b.isNew?'<button class="btn" data-act="bldreset">OSM haline döndür</button>':''}<button class="btn danger" data-act="blddel">${b.isNew?'Binayı sil':'Binayı kaldır'}</button></div>`;
  return h;
}
function ptInfo(id){
  if(typeof id==='string'){ const p=EDITS.points.find(p=>p.id===id); return p?{user:true,tags:p.tags}:null; }
  const n=RAW.nodes.get(id); return (!n||EDITS.delNodes.includes(id))?null:{user:false,tags:n.tags};
}
function ptPanelHTML(s){
  const p=ptInfo(s.id); if(!p) return null;
  const k=p.tags.highway;
  let h=`<header class="edh"><div><small>${p.user?'Senin eklediğin':'OSM verisi'}</small><h3>${k==='sign'?(SIGN_TR[p.tags.sign]||'Levha'):(KIND_TR[k]||k)}</h3></div><button data-act="close" aria-label="Kapat">×</button></header>`;
  if(k==='sign'){ h+=`<div class="blk"><span>Levha türü</span>${signGrid(p.tags.sign,'data-act="sgset" data-sg')}</div>`; if(p.tags.sign==='speed'){ const v=parseInt(p.tags.maxspeed)||50; h+=stepper('Hız','sp',v,v+' km/s')+`<div class="chips">${[20,30,40,50,70,82,90,110,120].map(x=>`<button data-act="spset" data-v="${x}" class="${x===v?'on':''}">${x}</button>`).join('')}</div>`; } }
  if(k==='speed_sign'){ const v=parseInt(p.tags.maxspeed)||50; h+=stepper('Hız','sp',v,v+' km/s')+`<div class="chips">${[20,30,50,70,82,90,110,120].map(x=>`<button data-act="spset" data-v="${x}" class="${x===v?'on':''}">${x}</button>`).join('')}</div>`; }
  if(k==='dir_sign') h+=`<label class="f"><span>Yazı</span><input id="edText" maxlength="24" value="${esc(p.tags.text||'')}"></label>`;
  if(k==='traffic_signals'&&!p.user) h+=`<p class="hint">Kavşaktaki her yaklaşım yönüne bir ışık ve dur çizgisi çizilir.</p>`;
  if(!p.user&&(k==='speed_sign'||k==='dir_sign')) {}
  h+=`<div class="acts"><button class="btn" data-act="move">Taşı</button><button class="btn danger" data-act="ptdel">Kaldır</button></div>`;
  return h;
}
function edPanel(){
  const el=$('#edpanel'), s=ED.sel;
  if(!ED.on||!s){ el.hidden=true; return; }
  let h=null;
  if(s.type==='way'){ const w=ways.get(s.id); if(w) h=wayPanelHTML(w); }
  else if(s.type==='bld') h=bldPanelHTML(s);
  else if(s.type==='pt') h=ptPanelHTML(s);
  if(!h){ ED.sel=null; drawSel(); el.hidden=true; return; }
  el.innerHTML=h; el.hidden=false;
}
$('#edpanel').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b||b.disabled) return;
  const s=ED.sel; if(!s) return;
  const a=b.dataset.act, d=+b.dataset.d||0, v=+b.dataset.v;
  if(a==='close'){ select(null); return; }
  if(s.type==='way'){
    const w=ways.get(s.id); if(!w) return; const t=w.t;
    if(a==='st'){
      const k=b.dataset.k;
      if(k==='lanes1'){ const n=clamp(w.L+d,1,8); setTags(s.id,{lanes:n,'turn:lanes':resizeLanes(t['turn:lanes'],n)}); }
      if(k==='fwd'||k==='bwd'){ let f=w.fwd,bw=w.bwd; if(k==='fwd') f=clamp(f+d,1,6); else bw=clamp(bw+d,1,6);
        setTags(s.id,{lanes:f+bw,'lanes:forward':f,'lanes:backward':bw,'turn:lanes:forward':resizeLanes(t['turn:lanes:forward'],f),'turn:lanes:backward':resizeLanes(t['turn:lanes:backward'],bw)}); }
      if(k==='ms'){ const n=clamp((parseInt(t.maxspeed)||0)+d*10,0,140); setTags(s.id,{maxspeed:n||null}); }
    }
    if(a==='msset') setTags(s.id,{maxspeed:v||null});
    if(a==='oneway'){
      if(v===1&&!w.oneway) setTags(s.id,{oneway:'yes',lanes:w.L,'lanes:forward':null,'lanes:backward':null,'turn:lanes:forward':null,'turn:lanes:backward':null});
      if(v===0&&w.oneway){ const f=Math.max(1,Math.ceil(w.L/2)), bw=Math.max(1,w.L-f); setTags(s.id,{oneway:'no',lanes:f+bw,'lanes:forward':f,'lanes:backward':bw,'turn:lanes':null}); }
    }
    if(a==='flip'){
      if(typeof s.id==='string') commit(E=>{ const r=E.roads.find(r=>r.id===s.id); if(r) r.coords.reverse(); });
      else setTags(s.id,{oneway:t.oneway==='-1'?'yes':'-1'});
    }
    if(a==='turn'){
      const key=b.dataset.k, n=+b.dataset.n, i=+b.dataset.i, arr=(t[key]||'').split('|'); while(arr.length<n) arr.push('');
      const cur=arr[i]?combo(arr[i]):''; arr[i]=TURN_OPTS[(TURN_OPTS.indexOf(cur)+1)%TURN_OPTS.length];
      const str=arr.slice(0,n).join('|'); setTags(s.id,{[key]:/[a-z]/.test(str.replace(/none/g,''))?str:null});
    }
    if(a==='resetway') commit(E=>{ delete E.ways[s.id]; });
    if(a==='delway'){ ED.sel=null; commit(E=>{ E.roads=E.roads.filter(r=>r.id!==s.id); }); toast('Yol silindi · Geri al ile geri getirebilirsin',2500); }
  }
  if(s.type==='bld'){
    if(a==='st') setBld(s,x=>{ x.levels=clamp((x.levels||1)+d,1,150); delete x.del; });
    if(a==='lvset') setBld(s,x=>{ x.levels=v; delete x.del; });
    if(a==='bldreset') commit(E=>{ delete E.blds[s.id]; });
    if(a==='blddel'){
      if(EDITS.newBlds.some(x=>x.id===s.id)){ ED.sel=null; commit(E=>{ E.newBlds=E.newBlds.filter(x=>x.id!==s.id); }); }
      else setBld(s,x=>{ x.del=true; });
    }
  }
  if(s.type==='pt'){
    const setPt=(k,val)=>commit(E=>{ const p=E.points.find(p=>p.id===s.id); if(p) p.tags[k]=String(val); });
    if(a==='st') { const p=ptInfo(s.id); setPt('maxspeed',clamp((parseInt(p.tags.maxspeed)||50)+d*10,10,140)); }
    if(a==='spset'){ setPt('maxspeed',v); ED.signSpeed=v; }
    if(a==='sgset'){ setPt('sign',b.dataset.sg); ED.signType=b.dataset.sg; if(b.dataset.sg==='speed') commit(E=>{ const p=E.points.find(p=>p.id===s.id); if(p&&!p.tags.maxspeed) p.tags.maxspeed='50'; }); }
    if(a==='move'){ setTool('move'); }
    if(a==='ptdel'){ ED.sel=null; commit(E=>{ if(typeof s.id==='string') E.points=E.points.filter(p=>p.id!==s.id); else if(!E.delNodes.includes(s.id)) E.delNodes.push(s.id); }); toast('Kaldırıldı · Geri al ile geri getirebilirsin',2500); }
  }
});
$('#edpanel').addEventListener('change',e=>{
  const s=ED.sel; if(!s) return; const v=e.target.value.trim();
  if(e.target.id==='edName') setTags(s.id,{name:v||null});
  if(e.target.id==='edCls') setTags(s.id,{highway:v});
  if(e.target.id==='edLv'){ const n=clamp(parseInt(v)||1,1,150); setBld(s,x=>{ x.levels=n; delete x.del; }); }
  if(e.target.id==='edText') commit(E=>{ const p=E.points.find(p=>p.id===s.id); if(p) p.tags.text=v||'Tabela'; });
});

/* ---- alt çubuk, yedek ---- */
function edInfo(){
  const n=editCount();
  $('#edCount').textContent=n?`${n} düzenleme`:'Henüz düzenleme yok';
  const sv=$('#edSave'); sv.textContent=ED.saveOk?'Bu tarayıcıya kaydedildi':'Kaydedilemedi · yedeği indir'; sv.className=ED.saveOk?'':'bad';
  $('#edUndo').disabled=!ED.undo.length; $('#edRedo').disabled=!ED.redo.length;
  const dt=$('#edData'); if(dt) dt.textContent=DATA_AT?`OSM verisi: ${new Date(DATA_AT).toLocaleDateString('tr-TR')}`:'OSM verisi yok';
}
function setEdit(on){
  ED.on=on; document.body.classList.toggle('edit',on);
  $('#edbar').hidden=!on; $('#bEdit').classList.toggle('on',on);
  try{ map.setLayoutProperty('ed-hit','visibility',on?'visible':'none'); }catch(e){}
  if(on){
    if(nav.driving){ nav.driving=false; $('#bGo').textContent='Devam'; }
    hideJV(); if(pickMode) setPick(false); if(popup) popup.remove();
    if(map.getZoom()<16.5) map.easeTo({zoom:17.2,duration:600});
    toast('Düzenleme açık. Bir yola, binaya ya da noktaya dokun.',3500);
  } else { ED.sel=null; setTool('select'); $('#edmenu').hidden=true; }
  drawSel(); edPanel(); edInfo(); edHint();
}
$('#bEdit').onclick=()=>setEdit(!ED.on);
$('#edbar').addEventListener('click',e=>{ const b=e.target.closest('[data-tool]'); if(b) setTool(ED.tool===b.dataset.tool&&b.dataset.tool!=='select'?'select':b.dataset.tool); });
$('#edUndo').onclick=undo; $('#edRedo').onclick=redo;
$('#edDone').onclick=()=>setEdit(false);
$('#edOrig').onclick=()=>{
  ED.show=!ED.show; document.body.classList.toggle('orig',!ED.show); $('#edOrig').classList.toggle('on',!ED.show);
  if(!ED.show){ setTool('select'); select(null); toast('Orijinal OSM görünümü · düzenlemelerin duruyor, sadece gizli',3000); }
  rebuild();
};
$('#edMore').onclick=()=>{ $('#edmenu').hidden=!$('#edmenu').hidden; };
$('#edExport').onclick=()=>{
  try{
    const blob=new Blob([JSON.stringify({app:'yol-harita-3b',v:1,saved:new Date().toISOString(),edits:EDITS},null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`yol-harita-duzenlemeler-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Yedek indirildi',2000);
  }catch(e){ toast('Yedek indirilemedi',2500); }
  $('#edmenu').hidden=true;
};
$('#edImport').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const j=JSON.parse(r.result); const im=cleanEdits(j.edits||j); commit(E=>{ Object.assign(E,im); }); ED.sel=null; edPanel(); toast(`Yedek yüklendi · ${editCount()} düzenleme`,2500); }
    catch(err){ toast('Bu dosya okunamadı; mevcut düzenlemelerin değişmedi.',3500); } };
  r.readAsText(f); e.target.value=''; $('#edmenu').hidden=true;
};
$('#edRefresh').onclick=()=>{ $('#edmenu').hidden=true; loadArea(true); };
let clrT;
$('#edClear').onclick=e=>{
  const b=e.currentTarget;
  if(!b.dataset.armed){ b.dataset.armed='1'; b.textContent='Emin misin? Tekrar bas'; clearTimeout(clrT); clrT=setTimeout(()=>{ delete b.dataset.armed; b.textContent='Tüm düzenlemeleri sil'; },4000); return; }
  delete b.dataset.armed; b.textContent='Tüm düzenlemeleri sil'; $('#edmenu').hidden=true;
  ED.sel=null; commit(E=>{ Object.assign(E,blankEdits()); }); toast('Hepsi silindi · Geri al ile geri getirebilirsin',3500);
};
document.addEventListener('keydown',e=>{
  if(!ED.on||e.target.matches('input,select,textarea')) return;
  const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&k==='z'){ e.preventDefault(); e.shiftKey?redo():undo(); return; }
  if((e.ctrlKey||e.metaKey)&&k==='y'){ e.preventDefault(); redo(); return; }
  if(k==='escape'){ if(ED.tool!=='select') setTool('select'); else select(null); }
  if(k==='enter'&&ED.draw) finishDraw();
  if(k==='backspace'&&ED.draw){ e.preventDefault(); ED.draw.pts.pop(); drawUpdate(); }
});
map.on('dblclick',e=>{ if(ED.on&&ED.draw){ e.preventDefault(); finishDraw(); } });


/* ============ başlat ============ */
map.on('load',()=>{
  addSignalImgs(); setWidths();
  setCar(START,-28);
  let phase=0; setInterval(()=>{ if(!stats.sig||document.hidden) return; phase=(phase+1)%12; ['r','y','g'].forEach(c=>map.setPaintProperty('ov-sig-'+c,'icon-opacity',lampOp(c,phase))); },1000);
  loadEdits(); edInfo();
  map.getSource('area').setData(feat('Polygon',[[[AREA.w,AREA.s],[AREA.e,AREA.s],[AREA.e,AREA.n],[AREA.w,AREA.n],[AREA.w,AREA.s]]]));
  loadArea(false);
  if(editCount()) toast(`${editCount()} kayıtlı düzenleme yüklendi.`,4000);
});
map.on('error',e=>{ if(e&&e.error&&/tiles\.openfreemap/.test(String(e.error.message||''))) status('err','Harita karoları yüklenemedi'); });
</script>
